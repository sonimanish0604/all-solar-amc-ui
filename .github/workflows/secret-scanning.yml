name: Secret Scanning

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks scan
        continue-on-error: true
        env:
          REPORT_DIR: ${{ github.workspace }}/gitleaks-reports
        run: bash scripts/security/run_gitleaks_scan.sh

      - name: Upload Gitleaks artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-reports
          path: gitleaks-reports

      - name: Publish Gitleaks summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SUMMARY_FILE="${GITHUB_WORKSPACE}/gitleaks-reports/summary.md"
          if [[ -f "${SUMMARY_FILE}" ]]; then
            cat "${SUMMARY_FILE}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Enforce Gitleaks exit code
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          EXIT_FILE="${GITHUB_WORKSPACE}/gitleaks-reports/exit_code.txt"
          SUMMARY_FILE="${GITHUB_WORKSPACE}/gitleaks-reports/summary.md"
          if [[ ! -f "${EXIT_FILE}" ]]; then
            echo "Missing ${EXIT_FILE}"
            exit 1
          fi
          if [[ -f "${SUMMARY_FILE}" ]]; then
            cat "${SUMMARY_FILE}"
          fi
          if [[ "$(cat "${EXIT_FILE}")" != "0" ]]; then
            echo "Gitleaks detected blocking findings."
            exit 1
          fi
