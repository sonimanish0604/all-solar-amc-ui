name: CI Checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate repository scaffold
        shell: bash
        run: |
          set -euo pipefail

          test -f README.md
          test -f docs/README.md
          test -f apps/mobile_app/README.md
          test -f design/README.md

      - name: Block Windows metadata files
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -name '*:Zone.Identifier' | grep -q .; then
            echo 'Windows Zone.Identifier files must not be committed.'
            exit 1
          fi
