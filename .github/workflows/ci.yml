name: CI Checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read
  actions: write

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      non_runtime_only: ${{ steps.classify.outputs.non_runtime_only }}
      change_scope: ${{ steps.classify.outputs.change_scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify change set
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          export FLAGS_FILE="${RUNNER_TEMP}/build_flags"
          export CHANGED_FILE_LIST="${RUNNER_TEMP}/changed_files.txt"
          case "${{ github.event_name }}" in
            pull_request)
              export GIT_DIFF_BASE="${{ github.event.pull_request.base.sha }}"
              export GIT_DIFF_HEAD="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              export GIT_DIFF_BASE="${{ github.event.before }}"
              export GIT_DIFF_HEAD="${{ github.sha }}"
              ;;
          esac
          bash scripts/cloudbuild/classify_changes.sh
          # shellcheck disable=SC1090
          source "${FLAGS_FILE}"
          echo "non_runtime_only=${NON_RUNTIME_ONLY}" >> "${GITHUB_OUTPUT}"
          echo "change_scope=${CHANGE_SCOPE}" >> "${GITHUB_OUTPUT}"

  lint-and-unit:
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.non_runtime_only != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-root --only main
          python -m pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit/API tests (pytest)
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest -q --junitxml=../test-results-junit.xml

      - name: Upload pytest report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: test-results-junit.xml

  integration-compose:
    runs-on: ubuntu-latest
    needs: [classify-changes, lint-and-unit]
    if: ${{ needs.classify-changes.outputs.non_runtime_only != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run docker-compose integration suite
        run: bash scripts/ci_api_integration.sh

  non-runtime-pass:
    runs-on: ubuntu-latest
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.non_runtime_only == 'true' }}
    steps:
      - name: Skip backend CI for non-runtime change set
        run: echo "Backend CI skipped for ${{ needs.classify-changes.outputs.change_scope }}-only changes."
