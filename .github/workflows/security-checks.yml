name: Security Checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  basic-security-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Block committed env files
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '.env' -o -name '.env.*' \) \
            ! -name '.env.example' \
            ! -path './.git/*' | grep -q .; then
            echo 'Do not commit runtime env files.'
            exit 1
          fi
