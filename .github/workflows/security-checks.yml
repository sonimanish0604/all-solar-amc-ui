name: Security Checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  actions: write

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      non_runtime_only: ${{ steps.classify.outputs.non_runtime_only }}
      change_scope: ${{ steps.classify.outputs.change_scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify change set
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "non_runtime_only=false" >> "${GITHUB_OUTPUT}"
            echo "change_scope=scheduled" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          export FLAGS_FILE="${RUNNER_TEMP}/build_flags"
          export CHANGED_FILE_LIST="${RUNNER_TEMP}/changed_files.txt"
          case "${{ github.event_name }}" in
            pull_request)
              export GIT_DIFF_BASE="${{ github.event.pull_request.base.sha }}"
              export GIT_DIFF_HEAD="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              export GIT_DIFF_BASE="${{ github.event.before }}"
              export GIT_DIFF_HEAD="${{ github.sha }}"
              ;;
          esac
          bash scripts/cloudbuild/classify_changes.sh
          # shellcheck disable=SC1090
          source "${FLAGS_FILE}"
          echo "non_runtime_only=${NON_RUNTIME_ONLY}" >> "${GITHUB_OUTPUT}"
          echo "change_scope=${CHANGE_SCOPE}" >> "${GITHUB_OUTPUT}"

  security-audit:
    needs: classify-changes
    if: ${{ github.event_name == 'schedule' || needs.classify-changes.outputs.non_runtime_only != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-root --only main
          python -m pip install bandit pip-audit

      - name: Run security audit suite
        id: security-audit-suite
        continue-on-error: true
        env:
          REPORT_DIR: ${{ github.workspace }}/security-reports
        run: bash ../scripts/security/run_security_audit_suite.sh

      - name: Upload security audit artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: security-reports

      - name: Enforce security audit exit code
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          EXIT_FILE="${GITHUB_WORKSPACE}/security-reports/exit_code.txt"
          SUMMARY_FILE="${GITHUB_WORKSPACE}/security-reports/summary.md"
          if [[ ! -f "${EXIT_FILE}" ]]; then
            echo "Missing ${EXIT_FILE}"
            exit 1
          fi
          if [[ -f "${SUMMARY_FILE}" ]]; then
            cat "${SUMMARY_FILE}"
          fi
          if [[ "$(cat "${EXIT_FILE}")" != "0" ]]; then
            echo "Security audit suite reported blocking findings."
            exit 1
          fi

  non-runtime-pass:
    runs-on: ubuntu-latest
    needs: classify-changes
    if: ${{ github.event_name != 'schedule' && needs.classify-changes.outputs.non_runtime_only == 'true' }}
    steps:
      - name: Skip backend security checks for non-runtime change set
        run: echo "Backend security checks skipped for ${{ needs.classify-changes.outputs.change_scope }}-only changes."
