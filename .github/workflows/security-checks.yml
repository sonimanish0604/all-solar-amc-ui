name: Security Checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  basic-security-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Block committed env files
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '.env' -o -name '.env.*' \) \
            ! -name '.env.example' \
            ! -path './.git/*' | grep -q .; then
            echo 'Do not commit runtime env files.'
            exit 1
          fi

      - name: Block committed Firebase client config
        shell: bash
        run: |
          set -euo pipefail

          blocked_paths=(
            "apps/mobile_app/android/app/google-services.json"
            "apps/mobile_app/ios/Runner/GoogleService-Info.plist"
            "apps/mobile_app/lib/firebase_options.dart"
            "apps/mobile_app/firebase.json"
          )

          for path in "${blocked_paths[@]}"; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "Do not commit Firebase client configuration: $path"
              echo "Materialize it locally or in CI from environment secrets instead."
              exit 1
            fi
          done
