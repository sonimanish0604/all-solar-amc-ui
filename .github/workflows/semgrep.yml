name: Semgrep

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: "29 4 * * 1"

permissions:
  contents: read

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      non_runtime_only: ${{ steps.classify.outputs.non_runtime_only }}
      change_scope: ${{ steps.classify.outputs.change_scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify change set
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "non_runtime_only=false" >> "${GITHUB_OUTPUT}"
            echo "change_scope=scheduled" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          export FLAGS_FILE="${RUNNER_TEMP}/build_flags"
          export CHANGED_FILE_LIST="${RUNNER_TEMP}/changed_files.txt"
          case "${{ github.event_name }}" in
            pull_request)
              export GIT_DIFF_BASE="${{ github.event.pull_request.base.sha }}"
              export GIT_DIFF_HEAD="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              export GIT_DIFF_BASE="${{ github.event.before }}"
              export GIT_DIFF_HEAD="${{ github.sha }}"
              ;;
          esac
          bash scripts/cloudbuild/classify_changes.sh
          # shellcheck disable=SC1090
          source "${FLAGS_FILE}"
          echo "non_runtime_only=${NON_RUNTIME_ONLY}" >> "${GITHUB_OUTPUT}"
          echo "change_scope=${CHANGE_SCOPE}" >> "${GITHUB_OUTPUT}"

  scan:
    needs: classify-changes
    if: ${{ github.event_name == 'schedule' || needs.classify-changes.outputs.non_runtime_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Semgrep CE scan
        continue-on-error: true
        env:
          REPORT_DIR: ${{ github.workspace }}/semgrep-reports
          SEMGREP_TARGETS: backend/app
        run: bash scripts/security/run_semgrep_ce_scan.sh

      - name: Upload Semgrep artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-reports
          path: semgrep-reports

      - name: Publish Semgrep summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SUMMARY_FILE="${GITHUB_WORKSPACE}/semgrep-reports/summary.md"
          if [[ -f "${SUMMARY_FILE}" ]]; then
            cat "${SUMMARY_FILE}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Enforce Semgrep exit code
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          EXIT_FILE="${GITHUB_WORKSPACE}/semgrep-reports/exit_code.txt"
          SUMMARY_FILE="${GITHUB_WORKSPACE}/semgrep-reports/summary.md"
          if [[ ! -f "${EXIT_FILE}" ]]; then
            echo "Missing ${EXIT_FILE}"
            exit 1
          fi
          if [[ -f "${SUMMARY_FILE}" ]]; then
            cat "${SUMMARY_FILE}"
          fi
          if [[ "$(cat "${EXIT_FILE}")" != "0" ]]; then
            echo "Semgrep detected blocking findings."
            exit 1
          fi

  non-runtime-pass:
    runs-on: ubuntu-latest
    needs: classify-changes
    if: ${{ github.event_name != 'schedule' && needs.classify-changes.outputs.non_runtime_only == 'true' }}
    steps:
      - name: Skip Semgrep for non-runtime change set
        run: echo "Semgrep skipped for ${{ needs.classify-changes.outputs.change_scope }}-only changes."
